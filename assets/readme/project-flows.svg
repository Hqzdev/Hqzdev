<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
<title id="title">Five systems, five useful outcomes</title>
<desc id="description">Tether captures agent calls. Slate synchronizes shared work and runs code. Grounded indexes and retrieves documents. Pilot Agent builds and verifies work. Metrix coordinates booking and payment. Detailed descriptions and repository links follow in the README.</desc>
